<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小邓的数据库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-top: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        nav {
            background: #f0f4f8;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-links a {
            margin-left: 20px;
            color: #2575fc;
            text-decoration: none;
            font-weight: 600;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            min-height: 600px;
        }
        
        .form-section {
            flex: 1;
            min-width: 350px;
            padding: 20px;
            border-right: 1px solid #eee;
            background: #f9fbfd;
        }
        
        .data-section {
            flex: 2;
            min-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2575fc;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: #2575fc;
            outline: none;
            box-shadow: 0 0 0 2px rgba(37, 117, 252, 0.2);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        button {
            background: #2575fc;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        button:hover {
            background: #1a68e8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        button i {
            margin-right: 8px;
        }
        
        .btn-danger {
            background: #e74c3c;
        }
        
        .btn-danger:hover {
            background: #c0392b;
        }
        
        .btn-success {
            background: #2ecc71;
        }
        
        .btn-success:hover {
            background: #27ae60;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid #2575fc;
            color: #2575fc;
        }
        
        .btn-outline:hover {
            background: #2575fc;
            color: white;
        }
        
        .search-box {
            display: flex;
            margin-bottom: 20px;
        }
        
        .search-box input {
            flex: 1;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        
        .search-box button {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            width: 100px;
        }
        
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-group {
            flex: 1;
            min-width: 150px;
        }
        
        .data-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 5px;
            max-height: 500px;
        }
        
        .data-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
            position: relative;
        }
        
        .data-item:hover {
            background: #f9f9f9;
        }
        
        .data-item:last-child {
            border-bottom: none;
        }
        
        .data-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #2575fc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .data-content {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .data-images {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .data-image {
            max-width: 150px;
            max-height: 150px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .data-image:hover {
            transform: scale(1.05);
        }
        
        .data-meta {
            font-size: 0.85rem;
            color: #999;
            display: flex;
            justify-content: space-between;
        }
        
        .data-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        }
        
        .action-btn {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 3px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .category-tag {
            display: inline-block;
            background: #e1f0ff;
            color: #2575fc;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        
        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .image-preview-item {
            position: relative;
            display: inline-block;
        }
        
        .image-preview-item img {
            max-width: 100px;
            max-height: 100px;
            border-radius: 5px;
        }
        
        .image-preview-item .remove-image {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: #f0f7ff;
            border-radius: 5px;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2575fc;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2575fc;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .category-item:last-child {
            border-bottom: none;
        }
        
        .category-actions {
            display: flex;
            gap: 5px;
        }
        
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        
        .image-modal-content img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 5px;
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        }
        
        .login-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: #2575fc;
            font-size: 1.8rem;
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .login-logo i {
            font-size: 3rem;
            color: #2575fc;
        }
        
        .admin-only {
            display: none;
        }
        
        .logged-in .admin-only {
            display: block;
        }
        
        .logged-in .guest-only {
            display: none;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .form-section {
                border-right: none;
                border-bottom: 1px solid #eee;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .data-actions {
                position: static;
                margin-top: 10px;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-container">
        <div class="login-form">
            <div class="login-logo">
                <i class="fas fa-database"></i>
            </div>
            <h2 class="login-title">小邓的数据库</h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button id="loginBtn" style="width: 100%;">登录</button>
            <div style="text-align: center; margin-top: 20px; color: #666;">
            </div>
        </div>
    </div>
    
    <!-- 主应用页面（默认隐藏） -->
    <div id="appPage" class="container" style="display: none;">
        <header>
            <h1><i class="fas fa-database"></i> 小邓的数据库</h1>
            <p class="subtitle">数据管理与展示系统</p>
        </header>
        
        <nav>
            <div class="nav-brand">
                <strong>数据总数: <span id="totalCount">0</span></strong>
            </div>
            <div class="nav-links">
                <span id="userInfo" style="color: #2575fc; font-weight: 600;"></span>
                <button id="exportBtn" class="btn-outline admin-only"><i class="fas fa-file-export"></i> 导出数据</button>
                <button id="manageCategoriesBtn" class="btn-outline admin-only"><i class="fas fa-tags"></i> 管理分类</button>
                <button id="logoutBtn" class="btn-outline"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
            </div>
        </nav>
        
        <div class="main-content">
            <section class="form-section admin-only">
                <h2 class="section-title">添加/编辑数据</h2>
                <form id="dataForm">
                    <input type="hidden" id="editId" value="">
                    
                    <div class="form-group">
                        <label for="title">标题</label>
                        <input type="text" id="title" required placeholder="输入数据标题">
                    </div>
                    
                    <div class="form-group">
                        <label for="category">分类</label>
                        <select id="category" required>
                            <option value="">选择分类</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">内容</label>
                        <textarea id="content" required placeholder="输入详细内容"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="imageUpload">上传图片</label>
                        <input type="file" id="imageUpload" accept="image/*" multiple>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" id="submitBtn"><i class="fas fa-plus"></i> 添加数据</button>
                        <button type="button" id="cancelEditBtn" class="btn-outline" style="display: none;"><i class="fas fa-times"></i> 取消编辑</button>
                    </div>
                </form>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="categoryCount">0</div>
                        <div class="stat-label">分类数量</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="imageCount">0</div>
                        <div class="stat-label">图片总数</div>
                    </div>
                </div>
            </section>
            
            <section class="data-section">
                <h2 class="section-title">数据检索与浏览</h2>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="输入关键词搜索...">
                    <button id="searchBtn"><i class="fas fa-search"></i> 搜索</button>
                </div>
                
                <div class="filters">
                    <div class="filter-group">
                        <label for="categoryFilter">按分类筛选</label>
                        <select id="categoryFilter">
                            <option value="">所有分类</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="sortBy">排序方式</label>
                        <select id="sortBy">
                            <option value="newest">最新添加</option>
                            <option value="oldest">最早添加</option>
                            <option value="title">按标题排序</option>
                        </select>
                    </div>
                </div>
                
                <div class="data-list" id="dataList">
                    <div class="empty-state">
                        <i class="fas fa-database"></i>
                        <p>暂无数据，请添加第一条记录</p>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <!-- 分类管理模态框 -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <h2 class="modal-title">管理分类</h2>
            <div class="form-group">
                <label for="newCategory">添加新分类</label>
                <div style="display: flex;">
                    <input type="text" id="newCategory" placeholder="输入新分类名称">
                    <button type="button" id="addCategoryBtn" style="margin-left: 10px;"><i class="fas fa-plus"></i> 添加</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>现有分类</label>
                <div id="categoryList"></div>
            </div>
            
            <div class="modal-actions">
                <button type="button" id="closeCategoryModal" class="btn-outline">关闭</button>
            </div>
        </div>
    </div>
    
    <!-- 导出选项模态框 -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <h2 class="modal-title">导出数据</h2>
            <p>选择导出格式：</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="exportJSON"><i class="fas fa-file-code"></i> JSON格式</button>
                <button id="exportCSV"><i class="fas fa-file-csv"></i> CSV格式</button>
            </div>
            <div class="modal-actions">
                <button type="button" id="closeExportModal" class="btn-outline">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 图片查看模态框 -->
    <div class="image-modal" id="imageModal">
        <span class="close-modal">&times;</span>
        <div class="image-modal-content">
            <img id="modalImage" src="" alt="预览图片">
        </div>
    </div>

    <script>
        // 数据存储键名
        const STORAGE_KEY = 'xiaodengDataManagementSystem';
        const CATEGORY_KEY = 'xiaodengDataCategories';
        const USER_KEY = 'xiaodengCurrentUser';
        
        // 初始化数据
        let dataItems = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let categories = JSON.parse(localStorage.getItem(CATEGORY_KEY)) || ['工作', '学习', '生活', '其他'];
        let currentUser = JSON.parse(localStorage.getItem(USER_KEY)) || null;
        
        // 用户账户（简单模拟，实际应用中应从服务器获取）
        const users = [
            { username: 'admin', password: '123456', role: 'admin', displayName: '管理员' },
            { username: 'user', password: '123456', role: 'user', displayName: '普通用户' }
        ];
        
        // DOM元素
        const loginPage = document.getElementById('loginPage');
        const appPage = document.getElementById('appPage');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfo = document.getElementById('userInfo');
        
        const dataForm = document.getElementById('dataForm');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const dataList = document.getElementById('dataList');
        const categorySelect = document.getElementById('category');
        const categoryFilter = document.getElementById('categoryFilter');
        const sortBy = document.getElementById('sortBy');
        const exportBtn = document.getElementById('exportBtn');
        const manageCategoriesBtn = document.getElementById('manageCategoriesBtn');
        const categoryModal = document.getElementById('categoryModal');
        const exportModal = document.getElementById('exportModal');
        const newCategoryInput = document.getElementById('newCategory');
        const addCategoryBtn = document.getElementById('addCategoryBtn');
        const categoryListDiv = document.getElementById('categoryList');
        const closeCategoryModal = document.getElementById('closeCategoryModal');
        const closeExportModal = document.getElementById('closeExportModal');
        const exportJSON = document.getElementById('exportJSON');
        const exportCSV = document.getElementById('exportCSV');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const editIdInput = document.getElementById('editId');
        const totalCount = document.getElementById('totalCount');
        const categoryCount = document.getElementById('categoryCount');
        const imageCount = document.getElementById('imageCount');
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const closeModal = document.querySelector('.close-modal');
        
        // 当前编辑的图片
        let currentImages = [];
        
        // 初始化
        function init() {
            // 检查是否已登录
            if (currentUser) {
                showAppPage();
            } else {
                showLoginPage();
            }
            
            // 事件监听
            loginBtn.addEventListener('click', handleLogin);
            logoutBtn.addEventListener('click', handleLogout);
            dataForm.addEventListener('submit', handleFormSubmit);
            searchBtn.addEventListener('click', searchData);
            searchInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') searchData();
            });
            categoryFilter.addEventListener('change', filterData);
            sortBy.addEventListener('change', sortData);
            exportBtn.addEventListener('click', () => exportModal.style.display = 'flex');
            manageCategoriesBtn.addEventListener('click', showCategoryModal);
            addCategoryBtn.addEventListener('click', addCategory);
            closeCategoryModal.addEventListener('click', () => categoryModal.style.display = 'none');
            closeExportModal.addEventListener('click', () => exportModal.style.display = 'none');
            exportJSON.addEventListener('click', exportDataAsJSON);
            exportCSV.addEventListener('click', exportDataAsCSV);
            cancelEditBtn.addEventListener('click', cancelEdit);
            imageUpload.addEventListener('change', handleImageUpload);
            closeModal.addEventListener('click', () => imageModal.style.display = 'none');
            
            // 点击模态框外部关闭
            window.addEventListener('click', function(e) {
                if (e.target === categoryModal) categoryModal.style.display = 'none';
                if (e.target === exportModal) exportModal.style.display = 'none';
                if (e.target === imageModal) imageModal.style.display = 'none';
            });
            
            // 回车键登录
            passwordInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
        }
        
        // 显示登录页面
        function showLoginPage() {
            loginPage.style.display = 'flex';
            appPage.style.display = 'none';
            usernameInput.value = '';
            passwordInput.value = '';
        }
        
        // 显示主应用页面
        function showAppPage() {
            loginPage.style.display = 'none';
            appPage.style.display = 'block';
            
            // 更新用户信息
            userInfo.textContent = `欢迎，${currentUser.displayName}`;
            
            // 根据用户角色显示/隐藏管理功能
            if (currentUser.role === 'admin') {
                document.body.classList.add('logged-in');
            } else {
                document.body.classList.remove('logged-in');
            }
            
            updateCategorySelects();
            renderDataList();
            updateStats();
        }
        
        // 处理登录
        function handleLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username || !password) {
                alert('请输入用户名和密码！');
                return;
            }
            
            // 验证用户
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
                showAppPage();
            } else {
                alert('用户名或密码错误！');
            }
        }
        
        // 处理退出登录
        function handleLogout() {
            currentUser = null;
            localStorage.removeItem(USER_KEY);
            showLoginPage();
        }
        
        // 显示分类管理模态框
        function showCategoryModal() {
            categoryModal.style.display = 'flex';
            renderCategoryList();
        }
        
        // 更新统计信息
        function updateStats() {
            totalCount.textContent = dataItems.length;
            categoryCount.textContent = categories.length;
            
            // 计算图片总数
            let totalImages = 0;
            dataItems.forEach(item => {
                if (item.images && item.images.length) {
                    totalImages += item.images.length;
                }
            });
            imageCount.textContent = totalImages;
        }
        
        // 更新分类选择器
        function updateCategorySelects() {
            // 清空选项
            categorySelect.innerHTML = '<option value="">选择分类</option>';
            categoryFilter.innerHTML = '<option value="">所有分类</option>';
            
            // 添加分类选项
            categories.forEach(category => {
                categorySelect.innerHTML += `<option value="${category}">${category}</option>`;
                categoryFilter.innerHTML += `<option value="${category}">${category}</option>`;
            });
        }
        
        // 保存数据到本地存储
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataItems));
            localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories));
            updateStats();
        }
        
        // 渲染数据列表
        function renderDataList(items = dataItems) {
            if (items.length === 0) {
                dataList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>没有找到匹配的数据</p>
                    </div>
                `;
                return;
            }
            
            dataList.innerHTML = items.map(item => `
                <div class="data-item" data-id="${item.id}">
                    <div class="data-title">
                        ${escapeHtml(item.title)}
                        <span class="category-tag">${escapeHtml(item.category)}</span>
                    </div>
                    <div class="data-content">${escapeHtml(item.content)}</div>
                    ${item.images && item.images.length ? `
                        <div class="data-images">
                            ${item.images.map((img, index) => `
                                <img src="${img}" alt="图片${index+1}" class="data-image" onclick="openImageModal('${img}')">
                            `).join('')}
                        </div>
                    ` : ''}
                    <div class="data-meta">
                        <span>添加时间: ${formatDate(item.timestamp)}</span>
                        <span>最后修改: ${formatDate(item.lastModified || item.timestamp)}</span>
                    </div>
                    ${currentUser.role === 'admin' ? `
                    <div class="data-actions">
                        <button class="action-btn btn-outline edit-btn" data-id="${item.id}">
                            <i class="fas fa-edit"></i> 编辑
                        </button>
                        <button class="action-btn btn-danger delete-btn" data-id="${item.id}">
                            <i class="fas fa-trash"></i> 删除
                        </button>
                    </div>
                    ` : ''}
                </div>
            `).join('');
            
            // 添加编辑和删除事件监听（仅管理员）
            if (currentUser.role === 'admin') {
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        editData(id);
                    });
                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = parseInt(this.getAttribute('data-id'));
                        deleteData(id);
                    });
                });
            }
        }
        
        // 打开图片查看模态框
        function openImageModal(imgSrc) {
            modalImage.src = imgSrc;
            imageModal.style.display = 'flex';
        }
        
        // 转义HTML特殊字符
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 格式化日期
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return `${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }
        
        // 处理图片上传
        function handleImageUpload(e) {
            const files = e.target.files;
            if (!files.length) return;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.match('image.*')) continue;
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    currentImages.push(e.target.result);
                    
                    // 添加预览
                    const previewItem = document.createElement('div');
                    previewItem.className = 'image-preview-item';
                    previewItem.innerHTML = `
                        <img src="${e.target.result}" alt="预览">
                        <span class="remove-image" data-index="${currentImages.length - 1}">&times;</span>
                    `;
                    imagePreview.appendChild(previewItem);
                    
                    // 添加删除事件
                    previewItem.querySelector('.remove-image').addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        currentImages.splice(index, 1);
                        previewItem.remove();
                        
                        // 更新所有预览项的索引
                        const allPreviews = imagePreview.querySelectorAll('.image-preview-item');
                        allPreviews.forEach((item, idx) => {
                            item.querySelector('.remove-image').setAttribute('data-index', idx);
                        });
                    });
                };
                
                reader.readAsDataURL(file);
            }
            
            // 清空文件输入
            e.target.value = '';
        }
        
        // 处理表单提交
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value.trim();
            const content = document.getElementById('content').value.trim();
            const editId = editIdInput.value;
            
            if (title && category && content) {
                if (editId) {
                    // 编辑现有数据
                    const index = dataItems.findIndex(item => item.id === parseInt(editId));
                    if (index !== -1) {
                        dataItems[index] = {
                            ...dataItems[index],
                            title,
                            category,
                            content,
                            images: currentImages.length ? currentImages : dataItems[index].images,
                            lastModified: Date.now()
                        };
                    }
                    cancelEdit();
                } else {
                    // 添加新数据
                    const newItem = {
                        id: Date.now(),
                        title,
                        category,
                        content,
                        images: currentImages,
                        timestamp: Date.now(),
                        lastModified: Date.now()
                    };
                    
                    dataItems.unshift(newItem);
                }
                
                saveData();
                renderDataList();
                dataForm.reset();
                imagePreview.innerHTML = '';
                currentImages = [];
                
                // 显示成功消息
                alert(editId ? '数据修改成功！' : '数据添加成功！');
            } else {
                alert('请填写所有字段！');
            }
        }
        
        // 编辑数据
        function editData(id) {
            const item = dataItems.find(item => item.id === id);
            if (item) {
                document.getElementById('title').value = item.title;
                document.getElementById('category').value = item.category;
                document.getElementById('content').value = item.content;
                editIdInput.value = item.id;
                
                // 设置图片
                currentImages = item.images || [];
                imagePreview.innerHTML = '';
                
                currentImages.forEach((img, index) => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'image-preview-item';
                    previewItem.innerHTML = `
                        <img src="${img}" alt="预览">
                        <span class="remove-image" data-index="${index}">&times;</span>
                    `;
                    imagePreview.appendChild(previewItem);
                    
                    // 添加删除事件
                    previewItem.querySelector('.remove-image').addEventListener('click', function() {
                        const idx = parseInt(this.getAttribute('data-index'));
                        currentImages.splice(idx, 1);
                        previewItem.remove();
                        
                        // 更新所有预览项的索引
                        const allPreviews = imagePreview.querySelectorAll('.image-preview-item');
                        allPreviews.forEach((item, i) => {
                            item.querySelector('.remove-image').setAttribute('data-index', i);
                        });
                    });
                });
                
                submitBtn.innerHTML = '<i class="fas fa-save"></i> 保存修改';
                cancelEditBtn.style.display = 'inline-block';
            }
        }
        
        // 取消编辑
        function cancelEdit() {
            dataForm.reset();
            editIdInput.value = '';
            imagePreview.innerHTML = '';
            currentImages = [];
            submitBtn.innerHTML = '<i class="fas fa-plus"></i> 添加数据';
            cancelEditBtn.style.display = 'none';
        }
        
        // 删除数据
        function deleteData(id) {
            if (confirm('确定要删除这条数据吗？此操作不可撤销。')) {
                dataItems = dataItems.filter(item => item.id !== id);
                saveData();
                renderDataList();
                alert('数据删除成功！');
            }
        }
        
        // 搜索数据
        function searchData() {
            const keyword = searchInput.value.trim().toLowerCase();
            filterData();
        }
        
        // 筛选数据
        function filterData() {
            const keyword = searchInput.value.trim().toLowerCase();
            const category = categoryFilter.value;
            
            let filteredItems = dataItems;
            
            // 关键词搜索
            if (keyword) {
                filteredItems = filteredItems.filter(item => 
                    item.title.toLowerCase().includes(keyword) ||
                    item.category.toLowerCase().includes(keyword) ||
                    item.content.toLowerCase().includes(keyword)
                );
            }
            
            // 分类筛选
            if (category) {
                filteredItems = filteredItems.filter(item => item.category === category);
            }
            
            // 排序
            sortData(filteredItems);
        }
        
        // 排序数据
        function sortData(items = dataItems) {
            const sortValue = sortBy.value;
            let sortedItems = [...items];
            
            switch(sortValue) {
                case 'newest':
                    sortedItems.sort((a, b) => b.timestamp - a.timestamp);
                    break;
                case 'oldest':
                    sortedItems.sort((a, b) => a.timestamp - b.timestamp);
                    break;
                case 'title':
                    sortedItems.sort((a, b) => a.title.localeCompare(b.title));
                    break;
            }
            
            renderDataList(sortedItems);
        }
        
        // 添加分类
        function addCategory() {
            const newCategory = newCategoryInput.value.trim();
            if (newCategory && !categories.includes(newCategory)) {
                categories.push(newCategory);
                saveData();
                updateCategorySelects();
                renderCategoryList();
                newCategoryInput.value = '';
                alert(`分类 "${newCategory}" 添加成功！`);
            } else if (categories.includes(newCategory)) {
                alert('该分类已存在！');
            } else {
                alert('请输入有效的分类名称！');
            }
        }
        
        // 渲染分类列表
        function renderCategoryList() {
            categoryListDiv.innerHTML = categories.map(category => `
                <div class="category-item">
                    <span>${category}</span>
                    <div class="category-actions">
                        <button class="action-btn btn-outline edit-category-btn" data-category="${category}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="action-btn btn-danger delete-category-btn" data-category="${category}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            // 添加编辑分类事件监听
            document.querySelectorAll('.edit-category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const category = this.getAttribute('data-category');
                    editCategory(category);
                });
            });
            
            // 添加删除分类事件监听
            document.querySelectorAll('.delete-category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const category = this.getAttribute('data-category');
                    deleteCategory(category);
                });
            });
        }
        
        // 编辑分类
        function editCategory(category) {
            const newName = prompt(`请输入新的分类名称：`, category);
            if (newName && newName.trim() && newName !== category) {
                if (categories.includes(newName)) {
                    alert('该分类名称已存在！');
                    return;
                }
                
                // 更新分类名称
                const index = categories.indexOf(category);
                categories[index] = newName;
                
                // 更新数据中的分类
                dataItems.forEach(item => {
                    if (item.category === category) {
                        item.category = newName;
                    }
                });
                
                saveData();
                updateCategorySelects();
                renderCategoryList();
                renderDataList();
                alert(`分类名称已从"${category}"修改为"${newName}"！`);
            }
        }
        
        // 删除分类
        function deleteCategory(category) {
            // 检查是否有数据使用该分类
            const hasData = dataItems.some(item => item.category === category);
            
            if (hasData) {
                alert(`无法删除分类 "${category}"，因为仍有数据使用该分类。请先修改或删除相关数据。`);
                return;
            }
            
            if (confirm(`确定要删除分类 "${category}" 吗？`)) {
                categories = categories.filter(c => c !== category);
                saveData();
                updateCategorySelects();
                renderCategoryList();
                alert(`分类 "${category}" 删除成功！`);
            }
        }
        
        // 导出数据为JSON
        function exportDataAsJSON() {
            const dataStr = JSON.stringify(dataItems, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            downloadFile(dataBlob, 'xiaodeng_data_export.json');
            exportModal.style.display = 'none';
        }
        
        // 导出数据为CSV
        function exportDataAsCSV() {
            if (dataItems.length === 0) {
                alert('没有数据可导出！');
                return;
            }
            
            // 创建CSV标题行
            const headers = ['ID', '标题', '分类', '内容', '图片数量', '添加时间', '最后修改时间'];
            let csvContent = headers.join(',') + '\n';
            
            // 添加数据行
            dataItems.forEach(item => {
                const row = [
                    item.id,
                    `"${item.title.replace(/"/g, '""')}"`,
                    `"${item.category.replace(/"/g, '""')}"`,
                    `"${item.content.replace(/"/g, '""')}"`,
                    item.images ? item.images.length : 0,
                    `"${formatDate(item.timestamp)}"`,
                    `"${formatDate(item.lastModified || item.timestamp)}"`
                ];
                csvContent += row.join(',') + '\n';
            });
            
            const dataBlob = new Blob([csvContent], {type: 'text/csv;charset=utf-8;'});
            downloadFile(dataBlob, 'xiaodeng_data_export.csv');
            exportModal.style.display = 'none';
        }
        
        // 下载文件
        function downloadFile(blob, filename) {
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // 初始化应用
        init();
    </script>
</body>
</html>
