<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小邓的数据库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-container">
        <div class="login-form">
            <div class="login-logo">
                <i class="fas fa-database"></i>
            </div>
            <h2 class="login-title">小邓的数据库</h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button id="loginBtn" style="width: 100%;">登录</button>
            <div style="text-align: center; margin-top: 20px; color: #666;">
            </div>
        </div>
    </div>
    
    <!-- 主应用页面（默认隐藏） -->
    <div id="appPage" class="container" style="display: none;">
        <header>
            <h1><i class="fas fa-database"></i> 小邓的数据库</h1>
            <p class="subtitle">数据管理与展示系统</p>
        </header>
        
        <nav>
            <div class="nav-brand">
                <strong>数据总数: <span id="totalCount">0</span></strong>
            </div>
            <div class="nav-links">
                <span id="userInfo" style="color: #2575fc; font-weight: 600;"></span>
                <button id="exportBtn" class="btn-outline admin-only"><i class="fas fa-file-export"></i> 导出数据</button>
                <button id="manageCategoriesBtn" class="btn-outline admin-only"><i class="fas fa-tags"></i> 管理分类</button>
                <button id="logoutBtn" class="btn-outline"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
            </div>
        </nav>
        
        <div class="main-content">
            <section class="form-section admin-only">
                <h2 class="section-title">添加/编辑数据</h2>
                <form id="dataForm">
                    <input type="hidden" id="editId" value="">
                    
                    <div class="form-group">
                        <label for="title">标题</label>
                        <input type="text" id="title" required placeholder="输入数据标题">
                    </div>
                    
                    <div class="form-group">
                        <label for="category">分类</label>
                        <select id="category" required>
                            <option value="">选择分类</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">内容</label>
                        <textarea id="content" required placeholder="输入详细内容"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="imageUpload">上传图片</label>
                        <input type="file" id="imageUpload" accept="image/*" multiple>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" id="submitBtn"><i class="fas fa-plus"></i> 添加数据</button>
                        <button type="button" id="cancelEditBtn" class="btn-outline" style="display: none;"><i class="fas fa-times"></i> 取消编辑</button>
                    </div>
                </form>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="categoryCount">0</div>
                        <div class="stat-label">分类数量</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="imageCount">0</div>
                        <div class="stat-label">图片总数</div>
                    </div>
                </div>
            </section>
            
            <section class="data-section">
                <h2 class="section-title">数据检索与浏览</h2>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="输入关键词搜索...">
                    <button id="searchBtn"><i class="fas fa-search"></i> 搜索</button>
                </div>
                
                <div class="filters">
                    <div class="filter-group">
                        <label for="categoryFilter">按分类筛选</label>
                        <select id="categoryFilter">
                            <option value="">所有分类</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="sortBy">排序方式</label>
                        <select id="sortBy">
                            <option value="newest">最新添加</option>
                            <option value="oldest">最早添加</option>
                            <option value="title">按标题排序</option>
                        </select>
                    </div>
                </div>
                
                <div class="data-list" id="dataList">
                    <div class="empty-state">
                        <i class="fas fa-database"></i>
                        <p>暂无数据，请添加第一条记录</p>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <!-- 分类管理模态框 -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <h2 class="modal-title">管理分类</h2>
            <div class="form-group">
                <label for="newCategory">添加新分类</label>
                <div style="display: flex;">
                    <input type="text" id="newCategory" placeholder="输入新分类名称">
                    <button type="button" id="addCategoryBtn" style="margin-left: 10px;"><i class="fas fa-plus"></i> 添加</button>
                </div>
            </div>
            
            <div class="form-group">
                <label>现有分类</label>
                <div id="categoryList"></div>
            </div>
            
            <div class="modal-actions">
                <button type="button" id="closeCategoryModal" class="btn-outline">关闭</button>
            </div>
        </div>
    </div>
    
    <!-- 导出选项模态框 -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <h2 class="modal-title">导出数据</h2>
            <p>选择导出格式：</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="exportJSON"><i class="fas fa-file-code"></i> JSON格式</button>
                <button id="exportCSV"><i class="fas fa-file-csv"></i> CSV格式</button>
            </div>
            <div class="modal-actions">
                <button type="button" id="closeExportModal" class="btn-outline">取消</button>
            </div>
        </div>
    </div>
    
    <!-- 图片查看模态框 -->
    <div class="image-modal" id="imageModal">
        <span class="close-modal">&times;</span>
        <div class="image-modal-content">
            <img id="modalImage" src="" alt="预览图片">
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
